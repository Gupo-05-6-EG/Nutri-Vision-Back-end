# Proxy da producao (docker-compose.prod.yml). O DNS interno do Docker resolve
# `api` para todas as replicas; o `resolver` + variavel faz o nginx reconsultar
# quando o numero de replicas muda (`docker compose up -d --scale api=N`).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 10m;  # fotos de refeicao

    location / {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}
