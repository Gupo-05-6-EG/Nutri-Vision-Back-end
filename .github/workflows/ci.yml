name: CI

on:
  push:
    branches: [main, develop]
  # Sem filtro de branch: PRs empilhados (base numa feature branch) tambem
  # precisam de CI, e com o filtro eles ficavam sem nenhum check.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations (alembic) contra Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrivision
          POSTGRES_PASSWORD: nutrivision
          POSTGRES_DB: nutrivision
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutrivision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://nutrivision:nutrivision@localhost:5432/nutrivision"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: Modelos e banco estao em sincronia
        run: alembic check

  backup:
    name: Backup e restauracao contra Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrivision
          POSTGRES_PASSWORD: nutrivision
          POSTGRES_DB: nutrivision
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutrivision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://nutrivision:nutrivision@localhost:5432/nutrivision"
      PGHOST: localhost
      PGUSER: nutrivision
      PGPASSWORD: nutrivision
      PGDATABASE: nutrivision
      BACKUP_DIR: ${{ runner.temp }}/backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Banco com schema e dados (TACO)
        run: |
          alembic upgrade head
          PYTHONPATH=. python scripts/importar_taco.py
      - name: Cliente do Postgres 16 (mesma versao do servidor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Backup gera dump valido com checksum
        run: |
          sh scripts/backup/backup.sh
          ls "$BACKUP_DIR"/diario/*.dump
          cd "$BACKUP_DIR/diario" && sha256sum -c ./*.sha256
      - name: Retencao apaga dumps antigos
        run: |
          touch -d '10 days ago' "$BACKUP_DIR/diario/nutrivision_antigo.dump"
          sh scripts/backup/backup.sh
          test ! -e "$BACKUP_DIR/diario/nutrivision_antigo.dump"
      - name: Teste de restauracao
        run: |
          sh scripts/backup/testar_restauracao.sh
          grep -q "OK .*alimento_taco=590" "$BACKUP_DIR/restauracoes.log"
      - name: Restaurar no banco em uso exige confirmacao
        run: |
          dump=$(ls -1t "$BACKUP_DIR"/diario/*.dump | head -n 1)
          if sh scripts/backup/restaurar.sh "$dump"; then exit 1; fi
          CONFIRMAR=sim sh scripts/backup/restaurar.sh "$dump"
          test "$(psql -tAc 'SELECT count(*) FROM alimento_taco')" = 590

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nutrivision-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sobe o container e valida o /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite+pysqlite:///./ci.db \
            nutrivision-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "API nao respondeu"; docker logs api; exit 1
