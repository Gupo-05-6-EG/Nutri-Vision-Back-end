services:
  db:
    image: postgres:16-alpine
    container_name: nutrivision-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutrivision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrivision}
      POSTGRES_DB: ${POSTGRES_DB:-nutrivision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrivision}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: nutrivision-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nutrivision}:${POSTGRES_PASSWORD:-nutrivision}@db:5432/${POSTGRES_DB:-nutrivision}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Backup diario + teste semanal de restauracao (Task 7.2, RNF10).
  # BACKUP_HOST_DIR deve ficar fora do disco do banco (outro disco, NAS, pasta
  # sincronizada com a nuvem...).
  backup:
    image: postgres:16-alpine
    container_name: nutrivision-backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-nutrivision}
      PGPASSWORD: ${POSTGRES_PASSWORD:-nutrivision}
      PGDATABASE: ${POSTGRES_DB:-nutrivision}
      TZ: ${TZ:-America/Sao_Paulo}
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_TESTE_CRON: ${BACKUP_TESTE_CRON:-30 3 * * 0}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-7}
      BACKUP_RETENCAO_SEMANAS: ${BACKUP_RETENCAO_SEMANAS:-4}
      BACKUP_NA_INICIALIZACAO: ${BACKUP_NA_INICIALIZACAO:-false}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    entrypoint: ["sh", "/scripts/agendar.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
