services:
  db:
    image: postgres:16-alpine
    container_name: nutrivision-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutrivision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrivision}
      POSTGRES_DB: ${POSTGRES_DB:-nutrivision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrivision}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: nutrivision-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nutrivision}:${POSTGRES_PASSWORD:-nutrivision}@db:5432/${POSTGRES_DB:-nutrivision}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
